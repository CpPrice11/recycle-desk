[package]
name = "recycle-desk"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "A small native Windows recycle bin manager"

[dependencies]
self_update = { version = "=1.3.1", default-features = false, features = ["github", "ureq", "native-tls", "archive-zip", "compression-zip-deflate", "signatures"] }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
self-replace = "=1.5.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
  "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Time"
] }

[dev-dependencies]
zipsign-api = { version = "=0.2.2", default-features = false, features = ["sign-zip", "verify-zip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
